<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Mining Platform Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --card-border: #30363d;
            --accent-color: #58a6ff;
            --success-color: #2ea043;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 70px;
        }

        .header {
            padding: 16px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-badge {
            font-size: 14px;
            color: var(--accent-color);
            font-weight: 600;
        }

        .container {
            padding: 16px;
        }

        .main-stats-card {
            background: linear-gradient(135deg, #1f242d, #161b22);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: bold;
            margin: 6px 0;
            color: #ffffff;
        }

        .stat-sub {
            font-size: 14px;
            color: var(--success-color);
            font-family: monospace;
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
        }

        .btn-primary {
            background-color: #238636;
            border-color: #2ea043;
            grid-column: span 2;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .contract-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .contract-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .status-tag {
            background-color: rgba(46, 160, 67, 0.15);
            color: var(--success-color);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            color: var(--text-secondary);
            font-size: 11px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-item.active {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="user-badge" id="user-display">Loading...</span>
        <span style="font-size: 12px; color: var(--text-secondary);">Server: 🟢 Online</span>
    </div>

    <div class="container">
        <div class="main-stats-card">
            <div class="stat-label">Загальний розрахунковий баланс</div>
            <div class="stat-value" id="total-balance-usd">$0.00</div>
            <div class="stat-label" style="margin-top: 10px;">Загальний активний Hashrate</div>
            <div class="stat-sub" id="total-hashrate">1.50 TH/s</div>
        </div>

        <div class="grid-buttons">
            <button class="btn btn-primary">⚡ ЗБІЛЬШИТИ HASHRATE</button>
            <button class="btn">💰 БАЛАНС</button>
            <button class="btn">💸 ВИВЕСТИ</button>
            <button class="btn">📊 СТАТИСТИКА</button>
            <button class="btn">👥 РЕФЕРАЛИ</button>
        </div>

        <div class="section-title">Мій Майнінг (Active Contracts)</div>
        <div id="contracts-list">
            <div class="contract-card">
                <div class="contract-header">
                    <strong>₿ BTC Mining Contract</strong>
                    <span class="status-tag">ACTIVE</span>
                </div>
                <div style="font-size: 13px; color: var(--text-secondary);">
                    Hashrate: <span style="color: #fff;">1.50 TH/s</span><br>
                    Нараховано: <span style="color: var(--success-color);" id="btc-earned">0.00001245 BTC</span><br>
                    Статус: Безстроковий
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item active">🏠<br>Home</a>
        <a href="#" class="nav-item">⛏️<br>Mining</a>
        <a href="#" class="nav-item">💰<br>Wallet</a>
        <a href="#" class="nav-item">📊<br>Stats</a>
        <a href="#" class="nav-item">👤<br>Profile</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-display').innerText = '@' + (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.id);
        } else {
            document.getElementById('user-display').innerText = 'ID: 123456789 (Dev)';
        }
    </script>
</body>
</html>
